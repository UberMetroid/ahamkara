[package]
name = "ahamkara-fx"
version = "2.5.4"
edition = "2021"
description = "Ahamkara client runtime — wish magic, smoke, sigils, whispers (WASM)"

# Standalone crate — built by wasm-pack for wasm32, not part of the
# host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions",
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "Clipboard",
  "CssStyleDeclaration",
  "CustomEvent",
  "CustomEventInit",
  "Document",
  "DomRect",
  "DomStringMap",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlDetailsElement",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MediaQueryListEvent",
  "Navigator",
  "Node",
  "NodeList",
  "Performance",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollToOptions",
  "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
