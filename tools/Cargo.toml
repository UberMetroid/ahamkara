[package]
name = "tools"
version = "0.1.0"
edition.workspace = true
description = "Ahamkara repo tooling — validate, ingest, verify, build"

[dependencies]
corpus = { path = "../corpus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
regex = "1.10"
