[package]
# Published name. `engine` is taken on crates.io and says nothing useful to
# an installer; `ahamkara` is free. Both binaries keep their names, so
# `cargo install ahamkara` yields the `ahamkara` CLI *and* `ahamkara-mcp`.
name = "ahamkara"
version = "0.1.0"
edition.workspace = true
description = "Ahamkara lore query engine — CLI search/stats/interactive over the canonical corpus"
license-file = "../LICENSE"
repository = "https://github.com/UberMetroid/ahamkara"
homepage = "https://ubermetroid.github.io/ahamkara/"
readme = "../README.md"
keywords = ["destiny", "bungie", "lore", "wish-dragon", "mcp"]
categories = ["command-line-utilities"]
# Ship the corpus and nothing else. Without data/ahamkara_corpus.jsonl inside
# the package, an installed `ahamkara-mcp` loads zero records and every lore
# query returns empty. The 640K ingest cache and the categories/catalog used
# only by the `tools` binaries stay in the repo but out of the crate, keeping
# it ~150K instead of ~1MB.
include = ["/src/**", "/data/ahamkara_corpus.jsonl"]

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "ahamkara"
path = "src/main.rs"

[[bin]]
name = "ahamkara-mcp"
path = "src/bin/ahamkara-mcp.rs"

[dependencies]
corpus = { package = "ahamkara-corpus", path = "../corpus", version = "0.1.0" }
serde_json = "1"