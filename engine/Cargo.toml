[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
description = "Ahamkara lore query engine — CLI search/stats/interactive over the canonical corpus"

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "ahamkara"
path = "src/main.rs"

[[bin]]
name = "ahamkara-mcp"
path = "src/bin/ahamkara-mcp.rs"

[dependencies]
corpus = { path = "../corpus" }
serde_json = "1"